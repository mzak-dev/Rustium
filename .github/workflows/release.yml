name: Release

# Every push to main runs `scripts/release.py plan`, which picks one of three paths:
#
#   pr       releasable commits (feat, fix, perf, revert, breaking) since the last tag: open or refresh the
#            release PR on `release/next`, which bumps [workspace.package] version, Cargo.lock and CHANGELOG.md.
#            release-approve.yml checks and approves that PR.
#   release  the version in Cargo.toml has no tag yet (the release PR was just merged): build the packages for
#            every target, then tag the commit and publish the GitHub release with them.
#   none     nothing releasable since the last tag: close a leftover release PR.
#
# Setup (GitHub App, variables, repository settings): docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release the version in Cargo.toml now if it has no tag yet (first release or a manual retry)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_BRANCH: release/next

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      next-version: ${{ steps.plan.outputs.next-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history and tags, to find the last release
          persist-credentials: false
      - id: plan
        run: |
          args=(plan --rev "$GITHUB_SHA")
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 scripts/release.py "${args[@]}"
        env:
          FORCE: ${{ inputs.force == true }}
      - name: Summary
        run: |
          {
            echo "### Release plan: \`$MODE\`"
            echo "Cargo.toml version: \`$VERSION\`, next version: \`${NEXT_VERSION:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          NEXT_VERSION: ${{ steps.plan.outputs.next-version }}

  release-pr:
    name: Release PR
    needs: plan
    if: needs.plan.outputs.mode == 'pr' || needs.plan.outputs.mode == 'none'
    runs-on: ubuntu-latest
    # Newer pushes supersede a waiting run; a running one finishes so the branch and the PR stay in step.
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - name: Check the release app is configured
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::Set the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret (docs/releasing.md)."
            exit 1
          fi
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}

      # The PR is opened by the app, not by GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not start CI, and
      # github-actions[bot] could not approve a PR it opened itself.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit as the app
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Open or refresh the release PR
        if: needs.plan.outputs.mode == 'pr'
        run: |
          git switch --force-create "$RELEASE_BRANCH"
          python3 scripts/release.py prepare --version "$NEXT_VERSION"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit --message "chore(release): v$NEXT_VERSION"
          git push --force origin "$RELEASE_BRANCH"

          body="$RUNNER_TEMP/release-pr.md"
          {
            echo "Merging this PR releases **Rustium v$NEXT_VERSION**: the release workflow tags the merge commit,"
            echo "builds the packages for Windows, Linux and macOS and publishes them as a GitHub release."
            echo
            echo "The workflow rewrites \`$RELEASE_BRANCH\` on every push to \`main\`, and the approval check accepts"
            echo "it only while it is exactly the version bump the commits call for, so do not push to it by hand."
            echo
            echo "## Changelog"
            echo
            python3 scripts/release.py notes --version "$NEXT_VERSION"
          } > "$body"

          title="chore(release): v$NEXT_VERSION"
          number=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "$title" --body-file "$body"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT_VERSION: ${{ needs.plan.outputs.next-version }}

      - name: Close a release PR that has nothing left to release
        if: needs.plan.outputs.mode == 'none'
        run: |
          number=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "Nothing to release since the last tag."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.mode == 'release'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
      - run: cargo build --release --locked --package rustium-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "$VERSION" dist
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - name: Attest build provenance
        # Artifact attestations need a public repository (or GitHub Enterprise Cloud for private ones).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    concurrency:
      group: publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the tag and the release
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 scripts/release.py notes --version "$VERSION" > "$notes"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists, replacing its files"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Rustium $TAG" --notes-file "$notes" --latest
          fi
          echo "Published [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
