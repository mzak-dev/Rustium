# Format with: cargo +nightly fmt --all   (options marked "nightly" are ignored on stable)
edition = "2024"
style_edition = "2024"
max_width = 120
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true

# Imports
imports_granularity = "Module"          # (nightly) one module per `use`
group_imports = "StdExternalCrate"      # (nightly) std / external / crate groups
reorder_imports = true

# Literals and macros
hex_literal_case = "Lower"              # (nightly)
format_macro_matchers = true            # (nightly)

# Comments and docs
wrap_comments = true                    # (nightly)
comment_width = 120                     # (nightly)
format_code_in_doc_comments = true      # (nightly)
normalize_doc_attributes = true         # (nightly)
