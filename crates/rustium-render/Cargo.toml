[package]
name = "rustium-render"
description = "wgpu viewport renderer for the Rustium voxel editor: chunk raster, grid, overlays and glass blur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck.workspace = true
glam.workspace = true
naga.workspace = true
rustium-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
wgpu.workspace = true

# Blocking on the GPU (error scopes, readbacks) is native only: a browser answers those promises only after the
# frame yields, so the web build waits for them with `wasm-bindgen-futures` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[dev-dependencies]
png.workspace = true
serde_json.workspace = true

[lints]
workspace = true
