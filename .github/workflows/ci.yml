name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # rustfmt.toml uses nightly-only options (import granularity, comment wrapping).
      - run: rustup toolchain install nightly --profile minimal --component rustfmt --no-self-update
      - run: cargo +nightly fmt --all -- --check

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover --start-directory scripts --verbose

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04, not ubuntu-latest (26.04): the Vulkan loader there (1.4.341) segfaults in
        # vkSetDebugUtilsObjectNameEXT when several test threads each own a device, which debug builds do.
        # 24.04 (loader 1.3.275) is also the image the Linux release is built on.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install lavapipe (software Vulkan) so the GPU tests run instead of skipping
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    name: Web build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: web
      # The crates the browser build compiles, linted as wasm32 (their cfg(target_arch = "wasm32") paths).
      - run: >-
          cargo clippy --locked --target wasm32-unknown-unknown --lib
          -p rustium-core -p rustium-platform -p rustium-render -p rustium-mcp -p rustium-app -p rustium-web
          -- -D warnings
      - uses: ./.github/actions/build-web
      - name: Keep the screenshots of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-smoke-test-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # One stable name for branch protection, whatever the matrix above looks like.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, release-tooling, check, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all CI jobs passed"
